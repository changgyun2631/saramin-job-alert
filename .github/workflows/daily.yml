name: daily

on:
  schedule:
    # GitHub cron이 4~6시간씩 늦게 돌아서 밤사이 여러 번 걸어두고, 오늘 첫 성공 한 번만 실행 (평일 00:17·02:17·04:17·06:17 KST)
    - cron: "17 15 * * 0-4"
    - cron: "17 17 * * 0-4"
    - cron: "17 19 * * 0-4"
    - cron: "17 21 * * 0-4"
  workflow_dispatch:         # Actions 탭에서 수동 실행 (항상 실행)

permissions:
  contents: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.once.outputs.done }}
    steps:
      - id: once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w daily.yml -s success -L 20 --created ">=$(TZ=Asia/Seoul date +%F)T00:00:00+09:00" --json databaseId -q length)
          echo "오늘 성공한 실행: $n"
          echo "done=$([ "$n" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

  run:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.done != '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python alert.py
        env:
          SARAMIN_KEY: ${{ secrets.SARAMIN_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: 본 공고 목록·엑셀 저장
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add jobs.json jobs.xlsx jobs.html
          git commit -m "공고 갱신 $(date +%F)" || exit 0
          git push
